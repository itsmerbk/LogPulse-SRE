name: LogPulse-SRE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -v
      - name: Run SRE incident & Git root-cause simulation
        run: python -m logpulse.demo_incident
